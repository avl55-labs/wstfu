name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  analyze:
    name: PSScriptAnalyzer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) { Register-PSRepository -Default }
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck -AllowClobber -Repository PSGallery
      - name: Analyze
        shell: pwsh
        run: |
          $issues = Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          if ($issues) { $issues | Format-Table -AutoSize | Out-String | Write-Host }
          $errors = @($issues | Where-Object Severity -eq 'Error')
          if ($errors.Count) { throw "$($errors.Count) analyzer error(s)." }
          Write-Host "No analyzer errors."

  test:
    name: Pester
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Pester
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) { Register-PSRepository -Default }
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5.0 -Force -Scope CurrentUser -SkipPublisherCheck -AllowClobber -Repository PSGallery
      - name: Run tests
        shell: pwsh
        run: |
          Import-Module Pester -MinimumVersion 5.5.0
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = './tests'
          $cfg.Output.Verbosity = 'Detailed'
          $cfg.Run.Exit = $true
          Invoke-Pester -Configuration $cfg

  syntax:
    name: Parse check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Parse wstfu.ps1
        shell: pwsh
        run: |
          $errors = $null
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./wstfu.ps1), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Host $_.Message }; throw 'Parse errors.' }
          Write-Host 'Parsed clean.'
