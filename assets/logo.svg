<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" role="img" aria-label="WSTFU mascot: an unimpressed girl with a plaster across her nose" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f2937"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <clipPath id="headClip">
      <ellipse cx="320" cy="292" rx="138" ry="152"/>
    </clipPath>
  </defs>

  <rect width="640" height="640" rx="96" fill="url(#bg)"/>
  <circle cx="320" cy="292" r="196" fill="#111a2b" stroke="#2b3a52" stroke-width="4"/>

  <!-- shoulders -->
  <path d="M138 540c0-74 82-122 182-122s182 48 182 122v58H138z" fill="#3b82f6"/>
  <path d="M272 400c16 26 80 26 96 0l-12 60c-12 20-60 20-72 0z" fill="#e0a683"/>

  <!-- long side hair, framing the face -->
  <path d="M176 288c0-104 66-176 144-176s144 72 144 176c0 78-6 132-14 176l-56-6c14-64 16-118 12-160-84 22-154-2-176-30-6 46-4 116 8 190l-54 6c-6-52-8-108-8-176z" fill="#22303f"/>

  <!-- head -->
  <ellipse cx="320" cy="292" rx="138" ry="152" fill="#f3c3a4"/>

  <!-- fringe with a swept hairline -->
  <g clip-path="url(#headClip)">
    <path d="M182 292 A138 152 0 0 1 458 292 C 442 244 402 210 340 204 C 268 197 208 232 182 292 Z" fill="#22303f"/>
    <path d="M244 130 C 218 176 206 232 208 288 L 244 282 C 240 226 252 176 274 140 Z" fill="#38bdf8"/>
    <path d="M182 292 A138 152 0 0 1 458 292 C 442 244 402 210 340 204 C 268 197 208 232 182 292 Z" fill="none" stroke="#1a2531" stroke-width="3"/>
  </g>

  <!-- brows: flat, unimpressed -->
  <rect x="234" y="252" width="68" height="12" rx="6" fill="#22303f" transform="rotate(-5 268 258)"/>
  <rect x="338" y="252" width="68" height="12" rx="6" fill="#22303f" transform="rotate(5 372 258)"/>

  <!-- eyes: half lidded -->
  <g>
    <ellipse cx="268" cy="300" rx="30" ry="24" fill="#ffffff"/>
    <ellipse cx="372" cy="300" rx="30" ry="24" fill="#ffffff"/>
    <circle cx="270" cy="306" r="13" fill="#1b2836"/>
    <circle cx="374" cy="306" r="13" fill="#1b2836"/>
    <circle cx="275" cy="301" r="4" fill="#ffffff"/>
    <circle cx="379" cy="301" r="4" fill="#ffffff"/>
    <path d="M238 300a30 24 0 0 1 60 0z" fill="#f3c3a4"/>
    <path d="M342 300a30 24 0 0 1 60 0z" fill="#f3c3a4"/>
    <path d="M238 296h60M342 296h60" stroke="#22303f" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- nose -->
  <path d="M320 318c-6 12-11 20-3 26" stroke="#d79b78" stroke-width="7" stroke-linecap="round" fill="none"/>

  <!-- plaster across the nose -->
  <g transform="rotate(-11 320 358)">
    <rect x="240" y="336" width="160" height="44" rx="16" fill="#f6d7b8" stroke="#d9ab84" stroke-width="4"/>
    <rect x="292" y="340" width="56" height="36" rx="8" fill="#fbeada"/>
    <g fill="#d9ab84">
      <circle cx="260" cy="348" r="3.4"/><circle cx="260" cy="358" r="3.4"/><circle cx="260" cy="368" r="3.4"/>
      <circle cx="276" cy="348" r="3.4"/><circle cx="276" cy="358" r="3.4"/><circle cx="276" cy="368" r="3.4"/>
      <circle cx="364" cy="348" r="3.4"/><circle cx="364" cy="358" r="3.4"/><circle cx="364" cy="368" r="3.4"/>
      <circle cx="380" cy="348" r="3.4"/><circle cx="380" cy="358" r="3.4"/><circle cx="380" cy="368" r="3.4"/>
    </g>
  </g>

  <!-- flat mouth -->
  <path d="M290 408h60" stroke="#b9695c" stroke-width="10" stroke-linecap="round"/>

  <!-- wordmark plate -->
  <rect x="86" y="534" width="468" height="84" rx="26" fill="#0b1220" opacity="0.92"/>
  <text x="320" y="592" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif"
        font-size="64" font-weight="800" letter-spacing="12" fill="#e8eef7">WSTFU</text>
</svg>
